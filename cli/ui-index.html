<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemical X: Swarm Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3.7.0/dist/vuetify.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />
  <style>
    :root {
      --xo-bg: #020617;
      --xo-surface: #0b1329;
      --xo-glass-bg: rgba(255,255,255,0.04);
      --xo-glass-border: rgba(255,255,255,0.08);
      --xo-cyan:   #38bdf8;
      --xo-pink:   #f472b6;
      --xo-lime:   #a3e635;
      --xo-purple: #8b5cf6;
      --xo-amber:  #fbbf24;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #app { height: 100%; background: var(--xo-bg) !important; font-family: 'Inter', system-ui, sans-serif !important; -webkit-font-smoothing: antialiased; }

    .xo-orb { position: fixed; border-radius: 9999px; pointer-events: none; z-index: 0; }
    .xo-orb--pink  { width: 560px; height: 560px; background: radial-gradient(circle, rgba(244,114,182,.14) 0%, rgba(244,114,182,.06) 40%, transparent 70%); top: -14%; left: -10%; animation: xo-drift 26s ease-in-out infinite; }
    .xo-orb--blue  { width: 480px; height: 480px; background: radial-gradient(circle, rgba(56,189,248,.13) 0%, rgba(56,189,248,.05) 40%, transparent 70%); bottom: 2%; right: -8%; animation: xo-drift 32s ease-in-out infinite -10s; }
    .xo-orb--lime  { width: 360px; height: 360px; background: radial-gradient(circle, rgba(163,230,53,.09) 0%, rgba(163,230,53,.04) 40%, transparent 70%); top: 50%; left: 50%; animation: xo-drift 38s ease-in-out infinite -18s; }
    @keyframes xo-drift { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(24px,-14px) scale(1.04); } 50% { transform: translate(-14px,20px) scale(.96); } 75% { transform: translate(12px,12px) scale(1.02); } }

    .xo-glass { background: var(--xo-glass-bg) !important; backdrop-filter: blur(20px) !important; -webkit-backdrop-filter: blur(20px) !important; border: 1px solid var(--xo-glass-border) !important; }

    .v-app-bar { background: rgba(2,6,23,.82) !important; backdrop-filter: blur(20px) !important; border-bottom: 1px solid rgba(255,255,255,.07) !important; }
    .v-navigation-drawer { background: rgba(5,10,30,.94) !important; backdrop-filter: blur(20px) !important; border-right: 1px solid rgba(255,255,255,.06) !important; }
    .v-main { background: transparent !important; }
    .v-list-item--active, .v-list-item--active .v-list-item-title { color: var(--xo-cyan) !important; }
    .v-list-item--active::before { background: rgba(56,189,248,.08) !important; }

    .xo-display { font-family: 'Space Grotesk', sans-serif !important; font-weight: 600; }
    .xo-mono    { font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important; font-size: 12px; }

    .xo-kpi { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
    .xo-kpi__value { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1; }
    .xo-kpi__label { font-size: 11px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .05em; }

    .xo-file-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .2s, transform .2s; }
    .xo-file-card:hover { border-color: rgba(56,189,248,.35); transform: translateY(-1px); }
    .xo-file-card__path { font-size: 12px; color: var(--xo-cyan); word-break: break-all; }
    .xo-file-card__meta { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 4px; }

    .xo-agent-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .2s; }
    .xo-agent-card--active { border-color: rgba(56,189,248,.4) !important; }
    .xo-agent-card__name  { font-size: 13px; font-weight: 500; }
    .xo-agent-card__role  { font-size: 11px; color: rgba(255,255,255,.45); }

    .xo-task-card {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 0;
      flex-shrink: 0;
      min-height: fit-content;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .xo-task-card--done {
      border-left: 3px solid var(--xo-lime) !important;
      background: rgba(15, 23, 42, 0.85);
    }
    .xo-task-card--in_progress {
      border-left: 3px solid var(--xo-amber) !important;
    }
    .xo-task-card--review {
      border-left: 3px solid var(--xo-purple) !important;
    }
    .xo-task-card--queued {
      border-left: 3px solid var(--xo-cyan) !important;
    }
    .xo-task-card--blocked {
      border-left: 3px solid #ef4444 !important;
      background: rgba(35, 12, 18, 0.72) !important;
    }
    .xo-task-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.45), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .xo-task-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(56, 189, 248, 0.12);
    }
    .xo-task-card:hover::before {
      opacity: 1;
    }
    .xo-task-card__header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .xo-task-card__id {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .xo-task-card__title {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.4;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .xo-task-card__path {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--xo-cyan);
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 6px;
      padding: 3px 7px;
      margin-bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .xo-task-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
    }
    .xo-task-card__assignee {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .xo-task-card__meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .xo-task-card__badge-atom {
      background: rgba(56, 189, 248, 0.12) !important;
      color: var(--xo-cyan) !important;
      border: 1px solid rgba(56, 189, 248, 0.28) !important;
    }
    .xo-task-card__badge-molecule {
      background: rgba(244, 114, 182, 0.12) !important;
      color: var(--xo-pink) !important;
      border: 1px solid rgba(244, 114, 182, 0.28) !important;
    }
    .xo-task-card__badge-organism {
      background: rgba(192, 132, 252, 0.12) !important;
      color: var(--xo-purple) !important;
      border: 1px solid rgba(192, 132, 252, 0.28) !important;
    }
    .xo-task-card__badge-utility {
      background: rgba(163, 230, 53, 0.12) !important;
      color: var(--xo-lime) !important;
      border: 1px solid rgba(163, 230, 53, 0.28) !important;
    }
    .xo-task-card__badge-view {
      background: rgba(251, 191, 36, 0.12) !important;
      color: var(--xo-amber) !important;
      border: 1px solid rgba(251, 191, 36, 0.28) !important;
    }

    .xo-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .xo-dot--active  { background: var(--xo-lime); box-shadow: 0 0 6px var(--xo-lime); }
    .xo-dot--idle    { background: var(--xo-cyan); }
    .xo-dot--offline { background: rgba(255,255,255,.25); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(56,189,248,.2); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56,189,248,.4); }

    .xo-post { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 12px 14px; }
    .xo-post__author { font-size: 12px; font-weight: 600; color: var(--xo-cyan); }
    .xo-post__msg    { font-size: 13px; margin-top: 4px; line-height: 1.5; }
    .xo-post__time   { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 6px; }

    .xo-savings-badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 9999px; background: rgba(163,230,53,.10); border: 1px solid rgba(163,230,53,.22); cursor: pointer; transition: background .2s; font-size: 13px; color: var(--xo-lime); font-weight: 500; }
    .xo-savings-badge:hover { background: rgba(163,230,53,.18); }

    .tier-atom     { background: rgba(56,189,248,.15)!important;  color: #38bdf8!important; }
    .tier-molecule { background: rgba(163,230,53,.15)!important;  color: #a3e635!important; }
    .tier-organism { background: rgba(244,114,182,.15)!important; color: #f472b6!important; }
    .tier-template { background: rgba(139,92,246,.15)!important;  color: #8b5cf6!important; }
    .tier-view     { background: rgba(251,191,36,.15)!important;  color: #fbbf24!important; }
    .tier-utility  { background: rgba(255,255,255,.12)!important; color: rgba(255,255,255,.7)!important; }
    .tier-hook     { background: rgba(56,189,248,.12)!important;  color: #7dd3fc!important; }
    .xo-hazard     { background: rgba(244,63,94,.15)!important;   color: #fb7185!important; }

    /* ── Bubblegum Task Details Sheet & Backdrop ── */
    .xo-details-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 300;
    }
    .xo-task-details-sheet {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(520px, 92vw);
      background: rgba(8, 15, 33, 0.96) !important;
      backdrop-filter: blur(28px) !important;
      -webkit-backdrop-filter: blur(28px) !important;
      border-left: 1px solid rgba(56, 189, 248, 0.2) !important;
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.7);
      z-index: 310;
      display: flex;
      flex-direction: column;
    }
    .xo-task-details-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .xo-task-details-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .xo-task-details-footer {
      padding: 12px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 9, 24, 0.85);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .xo-task-prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
    }
    .xo-task-prop-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .xo-event-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .xo-event-author {
      font-size: 11px;
      font-weight: 600;
      color: var(--xo-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .xo-event-msg {
      font-size: 12px;
      color: #f1f5f9;
      line-height: 1.45;
    }
    .xo-event-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      margin-left: auto;
      font-family: ui-monospace, monospace;
    }
    /* Paging footers (#7604): every long list says how much is shown and offers the next page. */
    .xo-load-more { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 4px; }
    .xo-load-more__count { font-size: 11px; color: rgba(255,255,255,.4); font-variant-numeric: tabular-nums; }
    .xo-pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; flex-shrink: 0; padding-top: 8px; }
  </style>
  <script src="https://unpkg.com/vue@3.5.42/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.0/dist/vuetify.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const { createApp, ref, reactive, computed, watch, provide, onMounted, onUnmounted, nextTick } = Vue;

// Page sizes (#7604): the server never sends a whole table; lists page on demand.
const TASK_PAGE = 25, AGENT_PAGE = 50, CODEBASE_PAGE = 60, DB_PAGE = 25;

const getJson = async (url) => {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
  return res.json();
};

const rangeLabel = (page, size, total) => {
  const first = total === 0 ? 0 : (page - 1) * size + 1;
  return first.toLocaleString() + '–' + Math.min(page * size, total).toLocaleString() + ' of ' + total.toLocaleString();
};

const XoLoadMore = {
  props: { shown: { type: Number, default: 0 }, total: { type: Number, default: 0 }, loading: Boolean, step: { type: Number, default: 25 }, noun: { type: String, default: 'items' } },
  emits: ['more'],
  template: `<div v-if="total > 0" class="xo-load-more" aria-live="polite">
    <span class="xo-load-more__count">Showing {{ shown.toLocaleString() }} of {{ total.toLocaleString() }} {{ total === 1 ? noun.replace(/s$/, '') : noun }}</span>
    <v-btn v-if="shown < total" size="x-small" variant="tonal" color="primary" :loading="loading" @click="$emit('more')">
      Load {{ Math.min(step, total - shown) }} more
    </v-btn>
  </div>`
};
const { createVuetify } = Vuetify;

const vuetify = createVuetify({
  theme: {
    defaultTheme: 'chemx',
    themes: {
      chemx: {
        dark: true,
        // Mirrors the tokens in cli/ui-page/components/00-tokens.css.
        colors: {
          background: '#0a0c10', surface: '#111419', 'surface-variant': '#1c212a',
          primary: '#62c9ff', secondary: '#a78bfa',
          success: '#4ade80', warning: '#fbbf24',
          error: '#f87171', info: '#62c9ff',
          'on-surface': '#e6e9ef', 'on-primary': '#0a0c10'
        }
      }
    }
  },
  // One look for every control: compact outlined fields, flat buttons, tonal chips.
  defaults: {
    VBtn: { variant: 'flat', rounded: 'md' },
    VTextField: { variant: 'outlined', density: 'compact', hideDetails: 'auto' },
    VSelect: { variant: 'outlined', density: 'compact', hideDetails: 'auto' },
    VTextarea: { variant: 'outlined', density: 'compact', hideDetails: 'auto' },
    VChip: { size: 'small', variant: 'tonal', rounded: 'md' },
    VCard: { rounded: 'lg', elevation: 0 }
  }
});

// Every page: its sidebar group, and the one line the page header shows under its title.
const NAV_ITEMS = [
  { id: 'overview',  group: 'Work',   icon: 'mdi-view-dashboard-outline', label: 'Overview',  description: 'What the swarm is doing right now, and what needs you.' },
  { id: 'attention', group: 'Work',   icon: 'mdi-inbox-outline',          label: 'Inbox',     description: 'Approvals, blocked tasks, lock requests and agent questions waiting on a person.' },
  { id: 'tasks',     group: 'Work',   icon: 'mdi-view-column-outline',    label: 'Tasks',     description: 'Every task on the board by status. Open one to see its full record.' },
  { id: 'social',    group: 'Team',   icon: 'mdi-message-text-outline',   label: 'Timeline',  description: 'Commits, decisions, handoffs and notes from every agent, newest first.' },
  { id: 'agents',    group: 'Team',   icon: 'mdi-account-group-outline',  label: 'Agents',    description: 'Your crew and every session handle: what each is working on and has done.' },
  { id: 'locks',     group: 'Team',   icon: 'mdi-lock-outline',           label: 'File locks', description: 'Who holds which file right now. A lease lapses after 5 minutes of no activity.' },
  { id: 'codebase',  group: 'System', icon: 'mdi-file-tree-outline',      label: 'Codebase',  description: 'Indexed files with their tier and line budget.' },
  { id: 'workbench', group: 'System', icon: 'mdi-text-box-edit-outline',  label: 'Prompts',   description: 'Build a scoped prompt for an agent from the board and the code index.' },
  { id: 'database',  group: 'System', icon: 'mdi-database-outline',       label: 'Database',  description: 'Browse and query the code-index tables.' },
  { id: 'settings',  group: 'System', icon: 'mdi-cog-outline',            label: 'Settings',  description: 'Maintenance actions for this board.' }
];
const NAV_GROUPS = ['Work', 'Team', 'System'].map((label) => ({ label, items: NAV_ITEMS.filter((item) => item.group === label) }));
const PAGE_META = { ...Object.fromEntries(NAV_ITEMS.map((item) => [item.id, item])), posts: { label: 'Post', description: 'One post with what came before it and its replies.' } };

const TIER_FILTERS = ['all','atom','molecule','organism','template','view','utility','hook'];

const TASK_COLUMNS = [
  { status: 'queued',      label: 'Queued',      color: 'primary',   icon: 'mdi-clock-outline'        },
  { status: 'in_progress', label: 'In Progress', color: 'warning',   icon: 'mdi-progress-clock'       },
  { status: 'review',      label: 'Review',      color: 'secondary', icon: 'mdi-eye-outline'          },
  { status: 'done',        label: 'Done',        color: 'success',   icon: 'mdi-check-circle-outline'  },
  { status: 'blocked',     label: 'Blocked',     color: 'error',     icon: 'mdi-alert-octagon-outline' }
];

const App = {
  template: `
<v-app theme="chemx" class="xo-app">
  <v-navigation-drawer v-model="drawer" :permanent="isWide" :temporary="!isWide" width="248" class="xo-nav" aria-label="Main navigation">
    <div class="xo-nav__brand">
      <span class="xo-nav__logo" aria-hidden="true">X</span>
      <div><div class="xo-nav__name">Chemical X</div><div class="xo-nav__sub">Agent coordination board</div></div>
    </div>
    <nav class="xo-nav__groups">
      <div v-for="group in navGroups" :key="group.label">
        <div class="xo-nav__heading">{{ group.label }}</div>
        <button v-for="item in group.items" :key="item.id" type="button" class="xo-nav__item" :class="{ 'is-active': tab === item.id }"
          :aria-current="tab === item.id ? 'page' : undefined" @click="handleNavClick(item.id)">
          <v-icon size="18">{{ item.icon }}</v-icon><span>{{ item.label }}</span>
          <span v-if="navBadge(item.id)" class="xo-nav__badge x-num">{{ navBadge(item.id) }}</span>
        </button>
      </div>
    </nav>
    <div class="xo-nav__foot">
      <span class="xo-live" :class="{ 'is-live': isLive }" :title="isLive ? 'Receiving live updates' : 'Live updates disconnected; showing the last data'">
        <span class="xo-live__dot" />{{ isLive ? 'Live' : 'Offline' }}
      </span>
      <span v-if="telemetry.totalTokens" class="x-num" title="Tokens and cost recorded on this board (chemx team telemetry)">
        {{ Number(telemetry.totalTokens).toLocaleString() }} tokens · \${{ Number(telemetry.totalCost || 0).toFixed(2) }} recorded
      </span>
      <button type="button" class="xo-nav__item xo-nav__item--small" @click="openModal"><v-icon size="16">mdi-chart-line</v-icon><span>Token savings</span></button>
    </div>
  </v-navigation-drawer>

  <v-main class="xo-main">
    <header class="xo-topbar">
      <v-btn v-if="!isWide" icon="mdi-menu" variant="text" size="small" aria-label="Open navigation" @click="drawer = !drawer" />
      <div class="xo-topbar__title">
        <h1>{{ currentNav.label }}</h1>
        <p v-if="currentNav.description">{{ currentNav.description }}</p>
      </div>
      <div class="xo-topbar__actions"><xo-notification-bell /></div>
    </header>
    <div class="xo-page" :class="'xo-page--' + tab">

      <template v-if="tab==='overview'">
        <xo-overview />
      </template>

      <!-- SOCIAL / FORUM & TIMELINE -->

  `,

  setup() {
    // The route lives in the URL hash, #/<tab>[/<id>] (#/tasks/42, #/agents/@x, #/posts/9), so a reload,
    // a bookmark or an agent's link lands on it. 'posts' is routable without a nav item.
    const tabIds = new Set([...NAV_ITEMS.map((item) => item.id), 'posts']);
    const parseHash = (hash) => {
      const [head = '', ...rest] = String(hash || '').replace(/^#\/?/, '').split('/');
      const isKnown = tabIds.has(head);
      return isKnown ? { tab: head, id: decodeURIComponent(rest.join('/')) } : null;
    };
    const currentHash = () => (typeof location !== 'undefined' ? location.hash : '');
    const route = reactive(parseHash(currentHash()) || { tab: 'overview', id: '' });
    const tab = computed({
      get: () => route.tab,
      set: (id) => { route.tab = id; route.id = ''; }
    });
    const hashOf = () => '#/' + route.tab + (route.id ? '/' + encodeURIComponent(route.id) : '');
    const navigate = (hash) => {
      const next = parseHash(hash);
      if (!next) return;
      route.tab = next.tab;
      route.id = next.id;
    };
    // The sidebar is always shown on wide screens and slides over on narrow ones.
    const display      = Vuetify.useDisplay();
    const isWide       = computed(() => display.mdAndUp.value);
    const drawer       = ref(isWide.value);
    const drawerPinned = ref(true);
    const currentNav   = computed(() => PAGE_META[route.tab] || { label: 'Chemical X', description: '' });
    const modal        = ref(false);
    const isLive       = ref(false);

    const togglePinDrawer = () => {
      drawerPinned.value = !drawerPinned.value;
      if (drawerPinned.value) {
        drawer.value = true;
      }
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem('chemx_menu_pinned', String(drawerPinned.value));
      }
    };

    const handleNavClick = (id) => {
      tab.value = id;
      if (!isWide.value) drawer.value = false;
    };

    const agents    = ref([]);
    const posts     = ref([]);
    const leases    = ref([]);
    const tasks     = ref([]);
    const codebase  = ref([]);
    const telemetry = ref({ totalTokens: 0, totalCost: 0 });
    const savings   = ref({ tokensSaved: 165000, dollarsSaved: 1.65, reductionPct: 88, actualCost: 0 });

    const agentFilter     = ref('all');
    const selectedAgentId = ref(null);
    const agentFilters    = ['all', 'active', 'idle', 'offline'];

    const selectedTier   = ref('all');
    const codebaseSearch = ref('');

    let timer = null;

    // Live posts, newest first; <xo-timeline> pages older ones itself (cli/ui-page/components).
    const postsDesc = computed(() => posts.value.map(window.ChemxUi.toPost).sort((a, b) => b.id - a.id));
    const readHandle = () => {
      try { return localStorage.getItem('chemx_handle') || '@ui-operator'; } catch { return '@ui-operator'; }
    };
    const me = ref(readHandle());
    const agentById = (id) => agents.value.find((a) => a.id === id || a.name === id) || null;
    const openAgent = (id) => { selectedAgentId.value = id; navigate('#/agents/' + id); };

    // Agents: the server filters and pages; the live view refreshes only the first, unfiltered page.
    const agentPage   = reactive({ total: 0, loading: false });
    const agentCounts = ref({});
    const filteredAgents = computed(() => agents.value);
    const agentCountLabel = (f) => (agentCounts.value[f] == null ? '' : '· ' + agentCounts.value[f].toLocaleString());
    const fetchAgents = async (offset) => {
      agentPage.loading = true;
      try {
        const d = await getJson('/api/agents?status=' + agentFilter.value + '&limit=' + AGENT_PAGE + '&offset=' + offset);
        const seen = new Set(offset ? agents.value.map((a) => a.id) : []);
        const page = (d.agents || []).filter((a) => !seen.has(a.id));
        agents.value = offset ? [...agents.value, ...page] : page;
        agentPage.total = d.total || 0;
        agentCounts.value = d.counts || agentCounts.value;
      } catch {} finally { agentPage.loading = false; }
    };
    const setAgentFilter = (f) => { agentFilter.value = f; fetchAgents(0); };
    const loadMoreAgents = () => fetchAgents(agents.value.length);

    // Kanban: each column is its own server page; filters run in SQL, so search covers every task.
    const taskSearch     = ref('');
    const taskTierFilter = ref('all');
    const hideTestTasks  = ref(true);
    const taskCounts     = ref({});
    const board = reactive(Object.fromEntries(TASK_COLUMNS.map((c) => [c.status, { items: [], total: 0, loading: false }])));
    let boardLoaded = false, boardRequest = 0, boardRefreshTimer = null, filterTimer = null;

    const taskQuery = (extra = {}) => {
      const p = new URLSearchParams();
      const q = taskSearch.value.trim();
      if (q) p.set('q', q);
      if (taskTierFilter.value !== 'all') p.set('tier', taskTierFilter.value);
      if (hideTestTasks.value) p.set('hideTests', '1');
      for (const [k, v] of Object.entries(extra)) p.set(k, String(v));
      return p.toString();
    };

    const loadBoard = async () => {
      const request = ++boardRequest;
      TASK_COLUMNS.forEach((c) => { board[c.status].loading = true; });
      try {
        const d = await getJson('/api/tasks/board?' + taskQuery({ limit: TASK_PAGE }));
        if (request !== boardRequest) return;
        for (const c of TASK_COLUMNS) {
          const col = d.columns?.[c.status];
          board[c.status].items = col?.tasks || [];
          board[c.status].total = col?.total || 0;
        }
        boardLoaded = true;
      } catch {} finally {
        if (request === boardRequest) TASK_COLUMNS.forEach((c) => { board[c.status].loading = false; });
      }
    };

    const loadMoreTasks = async (status) => {
      const col = board[status];
      if (col.loading) return;
      col.loading = true;
      try {
        const d = await getJson('/api/tasks?' + taskQuery({ status, limit: TASK_PAGE, offset: col.items.length }));
        const seen = new Set(col.items.map((t) => t.id));
        col.items = [...col.items, ...(d.tasks || []).filter((t) => !seen.has(t.id))];
        col.total = d.total ?? col.total;
      } catch {} finally { col.loading = false; }
    };

    // A live update re-reads each column to the depth already loaded, so "Load more" progress survives.
    const refreshBoard = async () => {
      if (!boardLoaded) return;
      await Promise.all(TASK_COLUMNS.map(async (c) => {
        const col = board[c.status];
        const limit = Math.min(200, Math.max(TASK_PAGE, col.items.length));
        try {
          const d = await getJson('/api/tasks?' + taskQuery({ status: c.status, limit }));
          col.items = d.tasks || [];
          col.total = d.total || 0;
        } catch {}
      }));
    };
    const scheduleBoardRefresh = () => {
      clearTimeout(boardRefreshTimer);
      boardRefreshTimer = setTimeout(refreshBoard, 600);
    };
    watch([taskSearch, taskTierFilter, hideTestTasks], () => {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(loadBoard, 250);
    });

    const tasksByStatus = (status) => board[status].items;
    const findLoadedTask = (id) => {
      for (const c of TASK_COLUMNS) {
        const hit = board[c.status].items.find((t) => t.id === id);
        if (hit) return hit;
      }
      return tasks.value.find((t) => t.id === id) || null;
    };

    const compliantCount  = computed(() => codebase.value.filter(f => !f.isOverBudget).length);
    const compliancePct   = computed(() => !codebase.value.length ? 0 : Math.round(compliantCount.value / codebase.value.length * 100));

    const filteredCodebase = computed(() => {
      const tierMatch = f => selectedTier.value === 'all' || f.tier === selectedTier.value;
      const textMatch = f => !codebaseSearch.value || f.path.toLowerCase().includes(codebaseSearch.value.toLowerCase());
      return codebase.value.filter(f => tierMatch(f) && textMatch(f));
    });
    // Codebase: one fetch, rendered a page at a time (the grid used to mount every file card).
    const codebasePage    = ref(1);
    const codebaseLoading = ref(false);
    const codebasePageCount = computed(() => Math.max(1, Math.ceil(filteredCodebase.value.length / CODEBASE_PAGE)));
    const codebasePageItems = computed(() => {
      const start = (codebasePage.value - 1) * CODEBASE_PAGE;
      return filteredCodebase.value.slice(start, start + CODEBASE_PAGE);
    });
    watch([selectedTier, codebaseSearch], () => { codebasePage.value = 1; });

    // The board component's columns: each status with its loaded cards and server total.
    const boardColumns = computed(() => TASK_COLUMNS.map((col) => ({
      status: col.status, label: col.label, items: tasksByStatus(col.status), total: board[col.status].total, loading: board[col.status].loading
    })));

    const navBadge = (id) => {
      if (id === 'tasks')    return taskCounts.value.in_progress || null;
      if (id === 'locks')    return leases.value.length || null;
      if (id === 'codebase') return codebase.value.length || null;
      return null;
    };

    const statusDotClass = (status) => {
      if (status === 'active' || status === 'running') return 'xo-dot--active';
      if (status === 'idle') return 'xo-dot--idle';
      return 'xo-dot--offline';
    };

    const formatTime = (ts) => {
      if (!ts) return '';
      try { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
      catch { return ''; }
    };

    // The live view (hydration and SSE) is bounded; paged lists re-read themselves instead of being replaced.
    let isFirstApply = true;
    const applyData = (d = {}) => {
      const isUnpagedAgentView = agentFilter.value === 'all' && agents.value.length <= AGENT_PAGE;
      if (d.agents && isUnpagedAgentView) agents.value = d.agents;
      if (d.agentsTotal != null && agentFilter.value === 'all') agentPage.total = d.agentsTotal;
      if (d.agentCounts) agentCounts.value = d.agentCounts;
      if (d.posts)     posts.value     = d.posts;
      if (d.leases)    leases.value    = d.leases;
      if (d.tasks)     tasks.value     = d.tasks;
      if (d.taskCounts) taskCounts.value = d.taskCounts;
      if (d.telemetry) telemetry.value = d.telemetry;
      if (d.savings)   savings.value   = d.savings;
      if (!isFirstApply && tab.value === 'tasks') scheduleBoardRefresh();
      isFirstApply = false;
    };

    const attentionItems = ref([]);
    const confirmAttention = async (id, action) => {
      try {
        await fetch('/api/swarm/attention/action', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: id, action })
        });
        attentionItems.value = attentionItems.value.filter(x => x.id !== id);
      } catch {}
    };

    const moveTask = async (id, status) => {
      try {
        const res = await fetch('/api/tasks/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId: id, status })
        });
        if (res.ok) {
          const t = findLoadedTask(id);
          if (t) t.status = status;
          scheduleBoardRefresh();
        }
      } catch {}
    };

    const selectedTaskDetail = ref(null);
    const selectedTaskEvents = ref([]);
    const taskUpdateMsg = ref('');
    const isUpdatingTask = ref(false);

    // Board cards are slim; the sheet opens on the card at once, then fills in the whole row.
    const openTaskDetail = async (id) => {
      const card = findLoadedTask(id);
      selectedTaskDetail.value = card ? { ...card } : { id, title: 'Loading task #' + id + '…' };
      selectedTaskEvents.value = [];
      const [full, feed] = await Promise.allSettled([
        getJson('/api/tasks/' + encodeURIComponent(id)),
        getJson('/api/feed?task_id=' + encodeURIComponent(id))
      ]);
      const isStillOpen = selectedTaskDetail.value?.id === id;
      if (!isStillOpen) return;
      const hasFull = full.status === 'fulfilled' && Boolean(full.value.task);
      if (hasFull) selectedTaskDetail.value = { ...card, ...full.value.task, related: full.value.related || {} };
      if (feed.status === 'fulfilled') selectedTaskEvents.value = feed.value.feed || [];
    };

    const closeTaskDetail = () => {
      selectedTaskDetail.value = null;
      selectedTaskEvents.value = [];
      if (route.tab === 'tasks') route.id = '';
    };

    // The sheet emits the note text; it posts as the viewer's handle (me), not a fixed one.
    const submitTaskUpdate = async (text) => {
      const message = String(text ?? taskUpdateMsg.value).trim();
      const canPost = Boolean(selectedTaskDetail.value) && Boolean(message) && !isUpdatingTask.value;
      if (!canPost) return;
      isUpdatingTask.value = true;
      try {
        const res = await fetch('/api/feed', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            task_id: selectedTaskDetail.value.id,
            message,
            author_id: me.value,
            event_type: 'status_update'
          })
        });
        if (res.ok) {
          taskUpdateMsg.value = '';
          const feedRes = await fetch('/api/feed?task_id=' + encodeURIComponent(selectedTaskDetail.value.id));
          if (feedRes.ok) {
            const data = await feedRes.json();
            selectedTaskEvents.value = data.feed || [];
          }
        }
      } catch {} finally {
        isUpdatingTask.value = false;
      }
    };

    const updateTaskStatusFromSheet = async (status) => {
      if (!selectedTaskDetail.value) return;
      await moveTask(selectedTaskDetail.value.id, status);
      selectedTaskDetail.value.status = status;
      try {
        const feedRes = await fetch('/api/feed?task_id=' + encodeURIComponent(selectedTaskDetail.value.id));
        if (feedRes.ok) {
          const data = await feedRes.json();
          selectedTaskEvents.value = data.feed || [];
        }
      } catch {}
    };

    const reassignTaskFromSheet = async (agentId) => {
      if (!selectedTaskDetail.value) return;
      try {
        const res = await fetch('/api/tasks/assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId: selectedTaskDetail.value.id, agentId })
        });
        if (res.ok) {
          selectedTaskDetail.value.assigned_agent_id = agentId;
          const t = findLoadedTask(selectedTaskDetail.value.id);
          if (t) t.assigned_agent_id = agentId;
        }
      } catch {}
    };

    const workbenchScopes = ['master', 'grade-f', 'grade-d', 'grade-c', 'grade-b', 'ai-slop', 'hotspots'];
    const activeWorkbenchScope = ref('master');
    const workbenchPrompt = ref('');
    const selectWorkbenchScope = async (scope) => {
      activeWorkbenchScope.value = scope;
      try {
        const res = await fetch('/api/prompts/generate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scope })
        });
        if (res.ok) {
          const d = await res.json();
          workbenchPrompt.value = d.prompt || '';
        }
      } catch {}
    };

    const dbTables = ref([]);
    const dbColumns = ref(['name', 'type']);
    const dbRows = ref([]);
    const sqlQuery = ref('SELECT name, type FROM sqlite_master WHERE type = "table"');
    const dbTable      = ref('');
    const dbPage       = ref(1);
    const dbTotalPages = ref(1);
    const dbTotalRows  = ref(0);
    const selectDbTable = async (name, page = 1) => {
      try {
        const d = await getJson('/api/db/browse?table=' + encodeURIComponent(name) + '&page=' + page + '&pageSize=' + DB_PAGE);
        dbColumns.value = d.columns || Object.keys(d.rows?.[0] || {});
        dbRows.value = d.rows || [];
        dbTable.value = d.table || name;
        dbPage.value = d.page || page;
        dbTotalPages.value = d.totalPages || 1;
        dbTotalRows.value = d.totalRows || 0;
      } catch {}
    };

    const initSse = () => {
      if (typeof window !== 'undefined' && window.__CHEMX_HYDRATED_STATE__) {
        applyData(window.__CHEMX_HYDRATED_STATE__);
      }
      try {
        const es = new EventSource('/api/swarm/events');
        es.onopen = () => { isLive.value = true; };
        es.onmessage = (event) => {
          isLive.value = true;
          try {
            applyData(JSON.parse(event.data));
          } catch {}
        };
        es.addEventListener('reload', () => {
          window.location.reload();
        });
        es.onerror = () => {
          isLive.value = false;
          fetch('/api/swarm/status').then(r => r.json()).then(applyData).catch(() => {});
        };
      } catch {
        fetch('/api/swarm/status').then(r => r.json()).then(applyData).catch(() => {});
      }
    };

    const postAction = async (action) => {
      try {
        await fetch('/api/swarm/settings/action', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action })
        });
      } catch {}
    };


    const openModal = () => { modal.value = true; };


    // Each tab loads its data the first time it opens, not all at once on page load.
    const loadedTabs = new Set();
    const tabLoaders = {
      tasks: loadBoard,
      codebase: async () => {
        codebaseLoading.value = true;
        try { codebase.value = (await getJson('/api/swarm/codebase')).files || []; } catch {} finally { codebaseLoading.value = false; }
      },
      attention: async () => {
        try { attentionItems.value = (await getJson('/api/attention')).items || []; } catch {}
      },
      database: async () => {
        try { dbTables.value = (await getJson('/api/db/tables')).tables || []; } catch {}
      },
      workbench: () => selectWorkbenchScope('master')
    };
    const ensureTabData = (id) => {
      const loader = tabLoaders[id];
      if (!loader || loadedTabs.has(id)) return;
      loadedTabs.add(id);
      loader();
    };
    watch(tab, (id) => {
      const isReturningToBoard = id === 'tasks' && loadedTabs.has('tasks');
      ensureTabData(id);
      if (isReturningToBoard) scheduleBoardRefresh();
    });
    // A route change pushes a history entry, so Back returns from a profile or a task sheet.
    watch(() => [route.tab, route.id], () => {
      const hasHistory = typeof history !== 'undefined';
      const isNewHash = hashOf() !== currentHash();
      if (hasHistory && isNewHash) history.pushState(null, '', hashOf());
    });
    const openRoutedTask = () => {
      const hasTaskId = route.tab === 'tasks' && Boolean(route.id);
      if (hasTaskId) openTaskDetail(Number(route.id) || route.id);
    };
    watch(() => route.id, openRoutedTask);
    const onHashChange = () => navigate(currentHash());

    provide('chemx', {
      posts: postsDesc, agents, leases, taskCounts, telemetry, me, route, navigate, openTaskDetail, agentById
    });

    onMounted(() => {
      initSse();
      ensureTabData(tab.value);
      ensureTabData('attention');
      openRoutedTask();
      window.addEventListener('hashchange', onHashChange);
      window.addEventListener('popstate', onHashChange);
    });

    onUnmounted(() => {
      clearTimeout(timer);
      clearTimeout(boardRefreshTimer);
      clearTimeout(filterTimer);
      window.removeEventListener('hashchange', onHashChange);
      window.removeEventListener('popstate', onHashChange);
    });

    return {
      tab, drawer, modal, drawerPinned, togglePinDrawer, handleNavClick,
      agents, posts, leases, tasks, codebase, telemetry, savings,
      agentFilter, agentFilters, selectedAgentId, filteredAgents, agentPage, agentCountLabel, setAgentFilter, loadMoreAgents,
      board, loadMoreTasks, route, navigate, openAgent,
      codebasePage, codebaseLoading, codebasePageCount, codebasePageItems, rangeLabel,
      dbTable, dbPage, dbTotalPages, dbTotalRows,
      TASK_PAGE, AGENT_PAGE, CODEBASE_PAGE, DB_PAGE,
      selectedTier, codebaseSearch, tierFilters: TIER_FILTERS,
      navItems: NAV_ITEMS, navGroups: NAV_GROUPS, navBadge, isWide, currentNav, boardColumns,
      taskColumns: TASK_COLUMNS, tasksByStatus, moveTask,
      taskSearch, taskTierFilter, hideTestTasks,
      selectedTaskDetail, selectedTaskEvents, taskUpdateMsg, isUpdatingTask,
      openTaskDetail, closeTaskDetail, submitTaskUpdate, updateTaskStatusFromSheet, reassignTaskFromSheet,
      postsDesc, compliantCount, compliancePct, filteredCodebase,
      attentionItems, confirmAttention, isLive,
      workbenchScopes, activeWorkbenchScope, workbenchPrompt, selectWorkbenchScope,
      dbTables, dbColumns, dbRows, sqlQuery, selectDbTable,
      statusDotClass, formatTime,
      postAction, openModal,
    };
  }
};

const app = createApp(App).component('xo-load-more', XoLoadMore);
// Each cli/ui-page/components file registers itself on window.ChemxUi.components (inlined by ui-html.js).
for (const [name, def] of Object.entries(window.ChemxUi?.components || {})) app.component(name, def);
app.use(vuetify).mount('#app');
</script>
</body>
</html>
