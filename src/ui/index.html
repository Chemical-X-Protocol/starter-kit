<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemical X: Swarm Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3.7.0/dist/vuetify.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />
  <style>
    :root {
      --xo-bg: #020617;
      --xo-surface: #0b1329;
      --xo-glass-bg: rgba(255,255,255,0.04);
      --xo-glass-border: rgba(255,255,255,0.08);
      --xo-cyan:   #38bdf8;
      --xo-pink:   #f472b6;
      --xo-lime:   #a3e635;
      --xo-purple: #8b5cf6;
      --xo-amber:  #fbbf24;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #app { height: 100%; background: var(--xo-bg) !important; font-family: 'Inter', system-ui, sans-serif !important; -webkit-font-smoothing: antialiased; }

    .xo-orb { position: fixed; border-radius: 9999px; pointer-events: none; z-index: 0; }
    .xo-orb--pink  { width: 560px; height: 560px; background: radial-gradient(circle, rgba(244,114,182,.14) 0%, rgba(244,114,182,.06) 40%, transparent 70%); top: -14%; left: -10%; animation: xo-drift 26s ease-in-out infinite; }
    .xo-orb--blue  { width: 480px; height: 480px; background: radial-gradient(circle, rgba(56,189,248,.13) 0%, rgba(56,189,248,.05) 40%, transparent 70%); bottom: 2%; right: -8%; animation: xo-drift 32s ease-in-out infinite -10s; }
    .xo-orb--lime  { width: 360px; height: 360px; background: radial-gradient(circle, rgba(163,230,53,.09) 0%, rgba(163,230,53,.04) 40%, transparent 70%); top: 50%; left: 50%; animation: xo-drift 38s ease-in-out infinite -18s; }
    @keyframes xo-drift { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(24px,-14px) scale(1.04); } 50% { transform: translate(-14px,20px) scale(.96); } 75% { transform: translate(12px,12px) scale(1.02); } }

    .xo-glass { background: var(--xo-glass-bg) !important; backdrop-filter: blur(20px) !important; -webkit-backdrop-filter: blur(20px) !important; border: 1px solid var(--xo-glass-border) !important; }

    .v-app-bar { background: rgba(2,6,23,.82) !important; backdrop-filter: blur(20px) !important; border-bottom: 1px solid rgba(255,255,255,.07) !important; }
    .v-navigation-drawer { background: rgba(5,10,30,.94) !important; backdrop-filter: blur(20px) !important; border-right: 1px solid rgba(255,255,255,.06) !important; }
    .v-main { background: transparent !important; }
    .v-list-item--active, .v-list-item--active .v-list-item-title { color: var(--xo-cyan) !important; }
    .v-list-item--active::before { background: rgba(56,189,248,.08) !important; }

    .xo-display { font-family: 'Space Grotesk', sans-serif !important; font-weight: 600; }
    .xo-mono    { font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important; font-size: 12px; }

    .xo-kpi { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
    .xo-kpi__value { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1; }
    .xo-kpi__label { font-size: 11px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .05em; }

    .xo-file-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .2s, transform .2s; }
    .xo-file-card:hover { border-color: rgba(56,189,248,.35); transform: translateY(-1px); }
    .xo-file-card__path { font-size: 12px; color: var(--xo-cyan); word-break: break-all; }
    .xo-file-card__meta { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 4px; }

    .xo-agent-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .2s; }
    .xo-agent-card--active { border-color: rgba(56,189,248,.4) !important; }
    .xo-agent-card__name  { font-size: 13px; font-weight: 500; }
    .xo-agent-card__role  { font-size: 11px; color: rgba(255,255,255,.45); }

    .xo-task-card {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 0;
      flex-shrink: 0;
      min-height: fit-content;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .xo-task-card--done {
      border-left: 3px solid var(--xo-lime) !important;
      background: rgba(15, 23, 42, 0.85);
    }
    .xo-task-card--in_progress {
      border-left: 3px solid var(--xo-amber) !important;
    }
    .xo-task-card--review {
      border-left: 3px solid var(--xo-purple) !important;
    }
    .xo-task-card--queued {
      border-left: 3px solid var(--xo-cyan) !important;
    }
    .xo-task-card--blocked {
      border-left: 3px solid #ef4444 !important;
      background: rgba(35, 12, 18, 0.72) !important;
    }
    .xo-task-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.45), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .xo-task-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(56, 189, 248, 0.12);
    }
    .xo-task-card:hover::before {
      opacity: 1;
    }
    .xo-task-card__header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .xo-task-card__id {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .xo-task-card__title {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.4;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .xo-task-card__path {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--xo-cyan);
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 6px;
      padding: 3px 7px;
      margin-bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .xo-task-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
    }
    .xo-task-card__assignee {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .xo-task-card__meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .xo-task-card__badge-atom {
      background: rgba(56, 189, 248, 0.12) !important;
      color: var(--xo-cyan) !important;
      border: 1px solid rgba(56, 189, 248, 0.28) !important;
    }
    .xo-task-card__badge-molecule {
      background: rgba(244, 114, 182, 0.12) !important;
      color: var(--xo-pink) !important;
      border: 1px solid rgba(244, 114, 182, 0.28) !important;
    }
    .xo-task-card__badge-organism {
      background: rgba(192, 132, 252, 0.12) !important;
      color: var(--xo-purple) !important;
      border: 1px solid rgba(192, 132, 252, 0.28) !important;
    }
    .xo-task-card__badge-utility {
      background: rgba(163, 230, 53, 0.12) !important;
      color: var(--xo-lime) !important;
      border: 1px solid rgba(163, 230, 53, 0.28) !important;
    }
    .xo-task-card__badge-view {
      background: rgba(251, 191, 36, 0.12) !important;
      color: var(--xo-amber) !important;
      border: 1px solid rgba(251, 191, 36, 0.28) !important;
    }

    .xo-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .xo-dot--active  { background: var(--xo-lime); box-shadow: 0 0 6px var(--xo-lime); }
    .xo-dot--idle    { background: var(--xo-cyan); }
    .xo-dot--offline { background: rgba(255,255,255,.25); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(56,189,248,.2); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56,189,248,.4); }

    .xo-post { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 12px 14px; }
    .xo-post__author { font-size: 12px; font-weight: 600; color: var(--xo-cyan); }
    .xo-post__msg    { font-size: 13px; margin-top: 4px; line-height: 1.5; }
    .xo-post__time   { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 6px; }

    .xo-savings-badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 9999px; background: rgba(163,230,53,.10); border: 1px solid rgba(163,230,53,.22); cursor: pointer; transition: background .2s; font-size: 13px; color: var(--xo-lime); font-weight: 500; }
    .xo-savings-badge:hover { background: rgba(163,230,53,.18); }

    .tier-atom     { background: rgba(56,189,248,.15)!important;  color: #38bdf8!important; }
    .tier-molecule { background: rgba(163,230,53,.15)!important;  color: #a3e635!important; }
    .tier-organism { background: rgba(244,114,182,.15)!important; color: #f472b6!important; }
    .tier-template { background: rgba(139,92,246,.15)!important;  color: #8b5cf6!important; }
    .tier-view     { background: rgba(251,191,36,.15)!important;  color: #fbbf24!important; }
    .tier-utility  { background: rgba(255,255,255,.12)!important; color: rgba(255,255,255,.7)!important; }
    .tier-hook     { background: rgba(56,189,248,.12)!important;  color: #7dd3fc!important; }
    .xo-hazard     { background: rgba(244,63,94,.15)!important;   color: #fb7185!important; }

    /* ── Bubblegum Task Details Sheet & Backdrop ── */
    .xo-details-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 300;
    }
    .xo-task-details-sheet {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(520px, 92vw);
      background: rgba(8, 15, 33, 0.96) !important;
      backdrop-filter: blur(28px) !important;
      -webkit-backdrop-filter: blur(28px) !important;
      border-left: 1px solid rgba(56, 189, 248, 0.2) !important;
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.7);
      z-index: 310;
      display: flex;
      flex-direction: column;
    }
    .xo-task-details-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .xo-task-details-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .xo-task-details-footer {
      padding: 12px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 9, 24, 0.85);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .xo-task-prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
    }
    .xo-task-prop-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .xo-event-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .xo-event-author {
      font-size: 11px;
      font-weight: 600;
      color: var(--xo-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .xo-event-msg {
      font-size: 12px;
      color: #f1f5f9;
      line-height: 1.45;
    }
    .xo-event-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      margin-left: auto;
      font-family: ui-monospace, monospace;
    }
  </style>
  <script src="https://unpkg.com/vue@3.5.42/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.0/dist/vuetify.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;
const { createVuetify } = Vuetify;

const vuetify = createVuetify({
  theme: {
    defaultTheme: 'chemx',
    themes: {
      chemx: {
        dark: true,
        colors: {
          background: '#020617', surface: '#0b1329',
          primary: '#38bdf8', secondary: '#8b5cf6',
          success: '#a3e635', warning: '#fbbf24',
          error: '#f472b6', info: '#38bdf8',
          'on-surface': '#f1f5f9'
        }
      }
    }
  }
});

const NAV_ITEMS = [
  { id: 'social',   icon: 'mdi-antenna',        label: 'Forum & Timeline' },
  { id: 'attention',icon: 'mdi-bell-outline',   label: 'Attention Inbox'  },
  { id: 'tasks',    icon: 'mdi-clipboard-list',  label: 'Tasks & Kanban'   },
  { id: 'locks',    icon: 'mdi-lock-outline',    label: 'File Locks Hub'   },
  { id: 'codebase', icon: 'mdi-code-braces',     label: 'AST Codebase'     },
  { id: 'workbench',icon: 'mdi-wrench-outline',  label: 'Prompt Workbench' },
  { id: 'database', icon: 'mdi-database-outline', label: 'Database Studio' },
  { id: 'settings', icon: 'mdi-tune-variant',    label: 'Settings'         },
];

const TIER_FILTERS = ['all','atom','molecule','organism','template','view','utility','hook'];

const TASK_COLUMNS = [
  { status: 'queued',      label: 'Queued',      color: 'primary',   icon: 'mdi-clock-outline'        },
  { status: 'in_progress', label: 'In Progress', color: 'warning',   icon: 'mdi-progress-clock'       },
  { status: 'review',      label: 'Review',      color: 'secondary', icon: 'mdi-eye-outline'          },
  { status: 'done',        label: 'Done',        color: 'success',   icon: 'mdi-check-circle-outline'  },
  { status: 'blocked',     label: 'Blocked',     color: 'error',     icon: 'mdi-alert-octagon-outline' }
];

const App = {
  template: `
<v-app theme="chemx">
  <div class="xo-orb xo-orb--pink" />
  <div class="xo-orb xo-orb--blue" />
  <div class="xo-orb xo-orb--lime" />

  <v-app-bar flat height="56" style="z-index:200;">
    <v-app-bar-nav-icon @click="drawer = !drawer" color="rgba(255,255,255,.7)">☰</v-app-bar-nav-icon>
    <div class="d-flex align-center gap-2 ml-1">
      <span class="xo-display" style="font-size:15px;color:#f1f5f9;">⚡ Chemical X</span>
      <v-chip size="x-small" color="primary" variant="tonal" class="ml-1">SWARM</v-chip>
    </div>
    <v-spacer />
    <div class="d-flex align-center gap-3 mr-3">
      <div class="xo-savings-badge" @click="openModal">
        ⚡ Saved {{ (savings.tokensSaved||165000).toLocaleString() }} tokens / \${{ Number(savings.dollarsSaved||1.65).toFixed(2) }}
      </div>
      <v-chip size="small" color="success" variant="tonal" prepend-icon="mdi-circle" style="font-size:11px;">M3 Live</v-chip>
    </div>
  </v-app-bar>

  <v-navigation-drawer v-model="drawer" :permanent="drawerPinned" width="230">
    <div class="px-4 py-3 d-flex align-center justify-space-between border-b" style="border-color:rgba(255,255,255,.07)!important;">
      <div class="xo-display" style="font-size:11px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;font-weight:700;">Navigation</div>
      <v-btn
        icon
        variant="text"
        size="x-small"
        :color="drawerPinned ? 'primary' : 'rgba(255,255,255,.4)'"
        :class="{ 'xo-btn--pinned': drawerPinned }"
        @click="togglePinDrawer"
        :title="drawerPinned ? 'Unpin menu (closes automatically on click)' : 'Pin menu (keeps drawer open)'"
        style="width:26px;height:26px;"
      >
        <v-icon size="16">{{ drawerPinned ? 'mdi-pin' : 'mdi-pin-outline' }}</v-icon>
      </v-btn>
    </div>
    <v-list density="compact" nav class="pa-2 d-flex flex-column" style="gap:4px;">
      <v-list-item
        v-for="item in navItems" :key="item.id"
        :prepend-icon="item.icon" :title="item.label" :value="item.id"
        :active="tab === item.id" rounded="lg" color="primary"
        @click="handleNavClick(item.id)"
      >
        <template v-if="navBadge(item.id)" #append>
          <v-chip size="x-small" color="primary" variant="tonal">{{ navBadge(item.id) }}</v-chip>
        </template>
      </v-list-item>
    </v-list>
  </v-navigation-drawer>

  <v-main style="height:100vh;overflow:hidden;">
    <div style="height:100%;overflow:hidden;display:flex;flex-direction:column;padding:16px;gap:16px;box-sizing:border-box;">

      <!-- SOCIAL / FORUM & TIMELINE -->
      <template v-if="tab==='social'">
        <div style="display:grid;grid-template-columns:260px 1fr 300px;gap:14px;flex:1;overflow:hidden;min-height:0;">

          <div class="xo-glass d-flex flex-column gap-2 pa-3" style="border-radius:14px;overflow-y:auto;">
            <div class="d-flex justify-space-between align-center mb-1">
              <span class="xo-display" style="font-size:13px;">Swarm Agents</span>
              <v-chip size="x-small" color="success" variant="tonal">{{ agents.length }}</v-chip>
            </div>
            <div class="d-flex gap-1 flex-wrap mb-1">
              <v-chip v-for="f in agentFilters" :key="f" size="x-small" style="cursor:pointer;"
                :color="agentFilter===f ? 'primary' : 'default'" :variant="agentFilter===f ? 'tonal' : 'outlined'"
                class="text-capitalize" @click="agentFilter = f">{{ f }}</v-chip>
            </div>
            <div v-for="a in filteredAgents" :key="a.id" class="xo-agent-card" :class="{'xo-agent-card--active': selectedAgentId===a.id}" @click="selectedAgentId=a.id">
              <div class="d-flex align-center gap-2">
                <span class="xo-dot" :class="statusDotClass(a.status)" />
                <span class="xo-agent-card__name">{{ a.name||a.id }}</span>
              </div>
              <div class="xo-agent-card__role mt-1">{{ a.role||a.status||'agent' }}</div>
            </div>
            <div v-if="!filteredAgents.length" class="text-center" style="color:rgba(255,255,255,.3);font-size:12px;padding:16px 0;">No agents</div>
          </div>

          <div class="xo-glass d-flex flex-column pa-3" style="border-radius:14px;overflow:hidden;">
            <div class="d-flex justify-space-between align-center mb-3">
              <span class="xo-display" style="font-size:13px;">Live Timeline</span>
              <v-chip size="x-small" color="primary" variant="tonal">{{ posts.length }}</v-chip>
            </div>
            <div style="flex:1;overflow-y:auto;" class="d-flex flex-column gap-2">
              <div v-for="p in postsDesc" :key="p.id" class="xo-post vb-postbit">
                <div class="xo-post__author">{{ p.author }}</div>
                <div class="xo-post__msg">{{ p.message }}</div>
                <div class="xo-post__time">{{ formatTime(p.createdAt) }}</div>
              </div>
              <div v-if="!posts.length" class="text-center" style="color:rgba(255,255,255,.3);font-size:12px;padding:32px 0;">
                <v-icon size="32" color="rgba(255,255,255,.15)">mdi-antenna</v-icon>
                <div class="mt-2">Waiting for swarm activity...</div>
              </div>
            </div>
          </div>

          <div class="xo-glass d-flex flex-column gap-3 pa-3" style="border-radius:14px;overflow-y:auto;">
            <div class="xo-display" style="font-size:13px;">Telemetry</div>
            <div class="xo-kpi">
              <div class="xo-kpi__label">Total Tokens</div>
              <div class="xo-kpi__value" style="color:var(--xo-cyan);">{{ (telemetry.totalTokens||0).toLocaleString() }}</div>
            </div>

      <!-- SETTINGS -->
      <template v-else-if="tab==='settings'">
        <div class="xo-glass pa-4" style="border-radius:14px;max-width:520px;min-height:0;">
          <div class="d-flex align-center gap-2 mb-4">
            <v-icon color="primary">mdi-tune-variant</v-icon>
            <span class="xo-display" style="font-size:15px;">Swarm Settings</span>
          </div>
          <div class="d-flex flex-column gap-3">
            <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px;">
              <div style="font-size:13px;font-weight:500;margin-bottom:10px;">Database Maintenance</div>
              <div class="d-flex gap-2">
                <v-btn size="small" variant="tonal" color="primary" prepend-icon="mdi-broom" @click="postAction('vacuum')">Vacuum DB</v-btn>
                <v-btn size="small" variant="tonal" color="success" prepend-icon="mdi-heart-pulse" @click="postAction('heartbeat')">Heartbeat</v-btn>
              </div>
            </div>
            <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px;">
              <div style="font-size:13px;font-weight:500;margin-bottom:4px;">Poll Interval</div>
              <div style="font-size:12px;color:rgba(255,255,255,.4);">Live updates every 2s via /api/swarm/status</div>
            </div>
          </div>
        </div>
      </template>

    </div>
  </v-main>

  <!-- Savings Dialog -->
  <v-dialog v-model="modal" max-width="540">
    <v-card style="background:#0b1329;border:1px solid rgba(56,189,248,.2);border-radius:16px;">
      <v-card-title class="d-flex align-center justify-space-between pa-4 pb-2">
        <span class="xo-display">⚡ Token Savings Certificate</span>
        <v-btn icon size="small" variant="text" @click="modal=false"><v-icon>mdi-close</v-icon></v-btn>
      </v-card-title>
      <v-card-text class="pa-4 pt-2">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
          <div class="xo-kpi"><div class="xo-kpi__label">Tokens Saved</div><div class="xo-kpi__value" style="color:var(--xo-cyan);">{{ (savings.tokensSaved||165000).toLocaleString() }}</div></div>
          <div class="xo-kpi"><div class="xo-kpi__label">Cost Avoided</div><div class="xo-kpi__value" style="color:var(--xo-lime);">\${{ Number(savings.dollarsSaved||1.65).toFixed(2) }}</div></div>
          <div class="xo-kpi"><div class="xo-kpi__label">Reduction</div><div class="xo-kpi__value" style="color:var(--xo-purple);">{{ savings.reductionPct||88 }}%</div></div>
          <div class="xo-kpi"><div class="xo-kpi__label">Actual Cost</div><div class="xo-kpi__value" style="color:var(--xo-amber);">\${{ Number(savings.actualCost||0).toFixed(4) }}</div></div>
        </div>
        <canvas id="cert" width="492" height="160" style="width:100%;border-radius:10px;border:1px solid rgba(56,189,248,.2);" />
      </v-card-text>
      <v-card-actions class="pa-4 pt-0">
        <v-btn variant="tonal" color="primary" prepend-icon="mdi-download" @click="download">Download PNG</v-btn>
        <v-spacer />
        <v-btn variant="text" @click="modal=false">Close</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>
</v-app>
  `,

  setup() {
    const tab          = ref('social');
    const drawerPinned = ref(typeof localStorage !== 'undefined' ? localStorage.getItem('chemx_menu_pinned') === 'true' : false);
    const drawer       = ref(drawerPinned.value ? true : false);
    const modal        = ref(false);

    const togglePinDrawer = () => {
      drawerPinned.value = !drawerPinned.value;
      if (drawerPinned.value) {
        drawer.value = true;
      }
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem('chemx_menu_pinned', String(drawerPinned.value));
      }
    };

    const handleNavClick = (id) => {
      tab.value = id;
      if (!drawerPinned.value) {
        drawer.value = false;
      }
    };

    const agents    = ref([]);
    const posts     = ref([]);
    const leases    = ref([]);
    const tasks     = ref([]);
    const codebase  = ref([]);
    const telemetry = ref({ totalTokens: 0, totalCost: 0 });
    const savings   = ref({ tokensSaved: 165000, dollarsSaved: 1.65, reductionPct: 88, actualCost: 0 });

    const agentFilter     = ref('all');
    const selectedAgentId = ref(null);
    const agentFilters    = ['all', 'active', 'idle', 'offline'];

    const selectedTier   = ref('all');
    const codebaseSearch = ref('');

    let timer = null;

    const postsDesc = computed(() => [...posts.value].reverse());

    const filteredAgents = computed(() => {
      if (agentFilter.value === 'all') return agents.value;
      return agents.value.filter(a => a.status === agentFilter.value);
    });

    const taskSearch     = ref('');
    const taskTierFilter = ref('all');
    const hideTestTasks  = ref(true);

    const isTestTask = (t) => {
      const title = t.title || '';
      return title.startsWith('E2E Verify Task') || title.startsWith('API Test Task');
    };

    const tasksByStatus = (status) => {
      const statuses = status === 'done' ? ['done', 'completed'] : (status === 'blocked' ? ['blocked', 'failed'] : [status]);
      return tasks.value.filter((t) => {
        const matchesStatus = statuses.includes(t.status);
        if (!matchesStatus) return false;

        if (hideTestTasks.value && isTestTask(t)) {
          return false;
        }

        if (taskTierFilter.value !== 'all') {
          const tier = t.tier || 'utility';
          if (tier !== taskTierFilter.value) return false;
        }

        if (taskSearch.value) {
          const query = taskSearch.value.toLowerCase();
          const titleMatch = (t.title || '').toLowerCase().includes(query);
          const pathMatch = (t.target_path || t.targetPath || '').toLowerCase().includes(query);
          const agentMatch = (t.assigned_agent_id || t.assignedTo || '').toLowerCase().includes(query);
          if (!titleMatch && !pathMatch && !agentMatch) return false;
        }

        return true;
      });
    };

    const compliantCount  = computed(() => codebase.value.filter(f => !f.lines || f.lines <= 100).length);
    const compliancePct   = computed(() => !codebase.value.length ? 0 : Math.round(compliantCount.value / codebase.value.length * 100));

    const filteredCodebase = computed(() => {
      const tierMatch = f => selectedTier.value === 'all' || f.tier === selectedTier.value;
      const textMatch = f => !codebaseSearch.value || f.path.toLowerCase().includes(codebaseSearch.value.toLowerCase());
      return codebase.value.filter(f => tierMatch(f) && textMatch(f));
    });

    const navBadge = (id) => {
      if (id === 'tasks')    return tasks.value.filter(t => t.status === 'in_progress').length || null;
      if (id === 'locks')    return leases.value.length || null;
      if (id === 'codebase') return codebase.value.length || null;
      return null;
    };

    const statusDotClass = (status) => {
      if (status === 'active' || status === 'running') return 'xo-dot--active';
      if (status === 'idle') return 'xo-dot--idle';
      return 'xo-dot--offline';
    };

    const formatTime = (ts) => {
      if (!ts) return '';
      try { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
      catch { return ''; }
    };

    const applyData = (d = {}) => {
      if (d.agents)    agents.value    = d.agents;
      if (d.posts)     posts.value     = d.posts;
      if (d.leases)    leases.value    = d.leases;
      if (d.tasks)     tasks.value     = d.tasks;
      if (d.telemetry) telemetry.value = d.telemetry;
      if (d.savings)   savings.value   = d.savings;
    };

    const attentionItems = ref([]);
    const confirmAttention = async (id, action) => {
      try {
        await fetch('/api/swarm/attention/action', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: id, action })
        });
        attentionItems.value = attentionItems.value.filter(x => x.id !== id);
      } catch {}
    };

    const moveTask = async (id, status) => {
      try {
        const res = await fetch('/api/tasks/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId: id, status })
        });
        if (res.ok) {
          const t = tasks.value.find(x => x.id === id);
          if (t) t.status = status;
        }
      } catch {}
    };

    const selectedTaskDetail = ref(null);
    const selectedTaskEvents = ref([]);
    const taskUpdateMsg = ref('');
    const isUpdatingTask = ref(false);

    const openTaskDetail = async (id) => {
      const t = tasks.value.find(x => x.id === id);
      selectedTaskDetail.value = t || null;
      selectedTaskEvents.value = [];
      if (t) {
        try {
          const res = await fetch('/api/feed?task_id=' + encodeURIComponent(id));
          if (res.ok) {
            const data = await res.json();
            selectedTaskEvents.value = data.feed || [];
          }
        } catch {}
      }
    };

    const closeTaskDetail = () => {
      selectedTaskDetail.value = null;
      selectedTaskEvents.value = [];
    };

    const submitTaskUpdate = async () => {
      if (!selectedTaskDetail.value || !taskUpdateMsg.value.trim() || isUpdatingTask.value) return;
      isUpdatingTask.value = true;
      try {
        const res = await fetch('/api/feed', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            task_id: selectedTaskDetail.value.id,
            message: taskUpdateMsg.value.trim(),
            author_id: '@ui-operator',
            event_type: 'status_update'
          })
        });
        if (res.ok) {
          taskUpdateMsg.value = '';
          const feedRes = await fetch('/api/feed?task_id=' + encodeURIComponent(selectedTaskDetail.value.id));
          if (feedRes.ok) {
            const data = await feedRes.json();
            selectedTaskEvents.value = data.feed || [];
          }
        }
      } catch {} finally {
        isUpdatingTask.value = false;
      }
    };

    const updateTaskStatusFromSheet = async (status) => {
      if (!selectedTaskDetail.value) return;
      await moveTask(selectedTaskDetail.value.id, status);
      selectedTaskDetail.value.status = status;
      try {
        const feedRes = await fetch('/api/feed?task_id=' + encodeURIComponent(selectedTaskDetail.value.id));
        if (feedRes.ok) {
          const data = await feedRes.json();
          selectedTaskEvents.value = data.feed || [];
        }
      } catch {}
    };

    const reassignTaskFromSheet = async (agentId) => {
      if (!selectedTaskDetail.value) return;
      try {
        const res = await fetch('/api/tasks/assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId: selectedTaskDetail.value.id, agentId })
        });
        if (res.ok) {
          selectedTaskDetail.value.assigned_agent_id = agentId;
          const t = tasks.value.find(x => x.id === selectedTaskDetail.value.id);
          if (t) t.assigned_agent_id = agentId;
        }
      } catch {}
    };

    const workbenchScopes = ['master', 'grade-f', 'grade-d', 'grade-c', 'grade-b', 'ai-slop', 'hotspots'];
    const activeWorkbenchScope = ref('master');
    const workbenchPrompt = ref('');
    const selectWorkbenchScope = async (scope) => {
      activeWorkbenchScope.value = scope;
      try {
        const res = await fetch('/api/prompts/generate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scope })
        });
        if (res.ok) {
          const d = await res.json();
          workbenchPrompt.value = d.prompt || '';
        }
      } catch {}
    };

    const dbTables = ref([]);
    const dbColumns = ref(['name', 'type']);
    const dbRows = ref([]);
    const sqlQuery = ref('SELECT name, type FROM sqlite_master WHERE type = "table"');
    const selectDbTable = async (name) => {
      try {
        const res = await fetch('/api/db/browse?table=' + encodeURIComponent(name));
        if (res.ok) {
          const d = await res.json();
          dbColumns.value = d.columns || Object.keys(d.rows?.[0] || {});
          dbRows.value = d.rows || [];
        }
      } catch {}
    };

    const initSse = () => {
      if (typeof window !== 'undefined' && window.__CHEMX_HYDRATED_STATE__) {
        applyData(window.__CHEMX_HYDRATED_STATE__);
      }
      try {
        const es = new EventSource('/api/swarm/events');
        es.onmessage = (event) => {
          try {
            applyData(JSON.parse(event.data));
          } catch {}
        };
        es.addEventListener('reload', () => {
          window.location.reload();
        });
        es.onerror = () => {
          fetch('/api/swarm/status').then(r => r.json()).then(applyData).catch(() => {});
        };
      } catch {
        fetch('/api/swarm/status').then(r => r.json()).then(applyData).catch(() => {});
      }
    };

    const postAction = async (action) => {
      try {
        await fetch('/api/swarm/settings/action', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action })
        });
      } catch {}
    };

    const drawCert = () => {
      const c = document.getElementById('cert');
      if (!c) return;
      const ctx = c.getContext('2d');
      const w = c.width, h = c.height;
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, w, h);
      const grad = ctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, '#8b5cf6'); grad.addColorStop(.4, '#38bdf8'); grad.addColorStop(.8, '#f472b6');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, w, 4);
      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 13px "Space Grotesk", sans-serif';
      ctx.fillText('⚡ CHEMICAL X TOKEN SAVINGS CERTIFICATE', 20, 30);
      ctx.fillStyle = '#a3e635'; ctx.font = 'bold 28px "Space Grotesk", sans-serif';
      ctx.fillText((savings.value.tokensSaved || 165000).toLocaleString() + ' TOKENS SAVED', 20, 70);
      ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 18px "Space Grotesk", sans-serif';
      ctx.fillText('\$' + Number(savings.value.dollarsSaved || 1.65).toFixed(2) + ' USD Avoided', 20, 104);
      ctx.fillStyle = '#8b5cf6'; ctx.font = '12px Inter, sans-serif';
      ctx.fillText('Reduction: ' + (savings.value.reductionPct || 88) + '%  |  Chemical X Protocol', 20, 138);
    };

    const openModal = async () => {
      modal.value = true;
      await nextTick();
      drawCert();
    };

    const download = () => {
      const c = document.getElementById('cert');
      if (!c) return;
      const a = document.createElement('a');
      a.download = 'chemx-token-savings.png';
      a.href = c.toDataURL('image/png');
      a.click();
    };

    onMounted(async () => {
      initSse();
      try {
        const r = await fetch('/api/swarm/codebase');
        if (r.ok) { const d = await r.json(); codebase.value = d.files || []; }
      } catch {}
      try {
        const r = await fetch('/api/attention');
        if (r.ok) { const d = await r.json(); attentionItems.value = d.items || []; }
      } catch {}
      try {
        const r = await fetch('/api/db/tables');
        if (r.ok) { const d = await r.json(); dbTables.value = d.tables || []; }
      } catch {}
      selectWorkbenchScope('master');
    });

    onUnmounted(() => clearTimeout(timer));

    return {
      tab, drawer, modal, drawerPinned, togglePinDrawer, handleNavClick,
      agents, posts, leases, tasks, codebase, telemetry, savings,
      agentFilter, agentFilters, selectedAgentId, filteredAgents,
      selectedTier, codebaseSearch, tierFilters: TIER_FILTERS,
      navItems: NAV_ITEMS, navBadge,
      taskColumns: TASK_COLUMNS, tasksByStatus, moveTask,
      taskSearch, taskTierFilter, hideTestTasks,
      selectedTaskDetail, selectedTaskEvents, taskUpdateMsg, isUpdatingTask,
      openTaskDetail, closeTaskDetail, submitTaskUpdate, updateTaskStatusFromSheet, reassignTaskFromSheet,
      postsDesc, compliantCount, compliancePct, filteredCodebase,
      attentionItems, confirmAttention,
      workbenchScopes, activeWorkbenchScope, workbenchPrompt, selectWorkbenchScope,
      dbTables, dbColumns, dbRows, sqlQuery, selectDbTable,
      statusDotClass, formatTime,
      postAction, openModal, download,
    };
  }
};

createApp(App).use(vuetify).mount('#app');
</script>
</body>
</html>
