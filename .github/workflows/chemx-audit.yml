name: Chemical X Architectural Gatekeeper

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  molecular-audit:
    name: Chemical X Architecture & Line Budget Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Run Chemical X Architectural Audit
        run: npx --yes chemx audit --min-grade=${{ vars.CHEMX_MIN_GRADE || 'B' }} --min-score=${{ vars.CHEMX_MIN_SCORE || 80 }} --markdown --output=AUDIT_REPORT.md
      - name: Upload Audit Scorecard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemical-x-audit-report
          path: AUDIT_REPORT.md

      - name: Post Architectural Audit Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('AUDIT_REPORT.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          DISCUSSION_URL="${{ vars.CHEMX_DISCUSSION_URL }}"
          if [ -z "$DISCUSSION_URL" ] && [ -f .chemx/discussion.json ]; then
            DISCUSSION_URL=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('.chemx/discussion.json')); console.log(d.url || ''); } catch (e) {}")
          fi
          if [ -z "$DISCUSSION_URL" ]; then
            DISCUSSION_URL="https://github.com/orgs/Chemical-X-Protocol/discussions/categories/npx-chemx-audit"
          fi

          {
            echo "<!-- chemical-x-audit-pr-comment -->"
            echo "> 💬 **Architectural Discussion Topic:** [View Discussion & Community Showcase]($DISCUSSION_URL)"
            echo ""
            cat AUDIT_REPORT.md
          } > PR_COMMENT.md

          EXISTING_COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[] | select(.body | contains("<!-- chemical-x-audit-pr-comment -->")) | .id' | head -n 1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING_COMMENT_ID" -F body=@PR_COMMENT.md
          else
            gh pr comment "$PR_NUMBER" --body-file PR_COMMENT.md
          fi

  scaffold-smoke-test:
    name: Framework Scaffolding Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Run Test Suite
        run: npm test
      - name: Multi-Framework Scaffolding Smoke Test
        run: |
          for fw in react vue svelte; do
            echo "Smoke testing scaffolding for framework: $fw"
            node cli/create.js test-app-$fw --framework=$fw --yes --skip-install
            if [ "$fw" = "react" ]; then
              test -f test-app-react/src/components/m-sample-card/m-sample-card.tsx
              ! ls test-app-react/src/components/m-sample-card/*.vue 2>/dev/null
              ! ls test-app-react/src/components/m-sample-card/*.svelte 2>/dev/null
            elif [ "$fw" = "vue" ]; then
              test -f test-app-vue/src/components/m-sample-card/m-sample-card.vue
              ! ls test-app-vue/src/components/m-sample-card/*.tsx 2>/dev/null
              ! ls test-app-vue/src/components/m-sample-card/*.svelte 2>/dev/null
            elif [ "$fw" = "svelte" ]; then
              test -f test-app-svelte/src/components/m-sample-card/m-sample-card.svelte
              ! ls test-app-svelte/src/components/m-sample-card/*.vue 2>/dev/null
              ! ls test-app-svelte/src/components/m-sample-card/*.tsx 2>/dev/null
            fi
            echo "Framework $fw scaffolded cleanly."
          done

