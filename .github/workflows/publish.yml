name: Publish NPM Packages

# Publishing is manual (npm 2FA). Run it from the Actions tab or `npm run publish:both` with an OTP.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pre-publish Framework Generation & Typecheck Gate
        run: node scripts/check-framework-generation.mjs

      - name: Publish packages to NPM
        run: npm run publish:both
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
